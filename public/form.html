<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- Formulaire de contact (FR) -->
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="nom" value="" />
    <input type="tel" name="telephone" value="" />
    <input type="email" name="email" value="" />
    <select name="objet">
      <option value="Demande d'information">Demande d'information</option>
      <option value="Demande de devis">Demande de devis</option>
      <option value="Réservation">Réservation</option>
    </select>
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
  </form>

  <!-- Formulaire de contact (EN) -->
  <form name="contact-en" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact-en" />
    <input type="text" name="name" value="" />
    <input type="tel" name="phone" value="" />
    <input type="email" name="email" value="" />
    <select name="subject">
      <option value="Request Information">Request Information</option>
      <option value="Request Quote">Request Quote</option>
      <option value="Booking">Booking</option>
    </select>
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
  </form>

  <!-- Formulaire de réservation / devis (FR) -->
  <form name="reservation" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="reservation" />
    <input type="text" name="adresse_depart" value="" />
    <input type="text" name="adresse_arrivee" value="" />
    <input type="text" name="date" value="" />
    <input type="text" name="heure" value="" />
    <select name="vehicule">
      <option value="Mercedes classe E (3pax)">Mercedes classe E (3pax)</option>
      <option value="Mercedes classe V (7pax)">Mercedes classe V (7pax)</option>
      <option value="Mercedes classe S (3pax)">Mercedes classe S (3pax)</option>
    </select>
    <input type="email" name="email" value="" />
    <input type="tel" name="telephone" value="" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
  </form>

  <!-- Formulaire de réservation / devis (EN) -->
  <form name="reservation-en" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="reservation-en" />
    <input type="text" name="pickup_address" value="" />
    <input type="text" name="dropoff_address" value="" />
    <input type="text" name="date" value="" />
    <input type="text" name="time" value="" />
    <select name="vehicle">
      <option value="Mercedes classe E (3pax)">Mercedes classe E (3pax)</option>
      <option value="Mercedes classe V (7pax)">Mercedes classe V (7pax)</option>
      <option value="Mercedes classe S (3pax)">Mercedes classe S (3pax)</option>
    </select>
    <input type="email" name="email" value="" />
    <input type="tel" name="phone" value="" />
    <textarea name="message"></textarea>
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
  </form>
</body>
</html>
