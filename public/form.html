<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Skeleton</title>
</head>
<body>
  <!-- Formulaire de contact -->
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
    <input type="hidden" name="source" value="" />
    <input type="hidden" name="post_id" value="" />
    <input type="hidden" name="form_id" value="" />
    <input type="hidden" name="referer_title" value="" />
    <input type="hidden" name="queried_id" value="" />
    <input type="hidden" name="trp-form-language" value="" />

    <input type="text" name="form_fields[name]" value="" />
    <input type="tel" name="form_fields[field_1cab8d7]" value="" />
    <input type="email" name="form_fields[email]" value="" />
    <select name="form_fields[field_9954fef]">
      <option value="Demande d'information">Demande d'information</option>
      <option value="Demande de devis">Demande de devis</option>
      <option value="Réservation">Réservation</option>
    </select>
    <textarea name="form_fields[message]"></textarea>
  </form>

  <!-- Formulaire de réservation / devis -->
  <form name="reservation" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="reservation" />
    <input type="hidden" name="pageUrl" value="" />
    <input type="hidden" name="timestamp" value="" />
    <input type="hidden" name="source" value="" />
    <input type="hidden" name="post_id" value="" />
    <input type="hidden" name="form_id" value="" />
    <input type="hidden" name="referer_title" value="" />
    <input type="hidden" name="queried_id" value="" />
    <input type="hidden" name="trp-form-language" value="" />

    <input type="text" name="form_fields[field_efe4dce]" value="" />
    <input type="text" name="form_fields[field_2342981]" value="" />
    <input type="text" name="form_fields[field_491d849]" value="" />
    <input type="text" name="form_fields[field_9961b70]" value="" />
    <select name="form_fields[field_fbb2aa6]">
      <option value="Mercedes classe E (3pax)">Mercedes classe E (3pax)</option>
      <option value="Mercedes classe V (7pax)">Mercedes classe V (7pax)</option>
      <option value="Mercedes classe S (3pax)">Mercedes classe S (3pax)</option>
    </select>
    <input type="email" name="form_fields[email]" value="" />
    <input type="tel" name="form_fields[field_b3cb97b]" value="" />
    <textarea name="form_fields[message]"></textarea>
  </form>
</body>
</html>
